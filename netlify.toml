[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.23.4 and aborts the build below that, so the
  # Netlify build must run on a current LTS line.
  NODE_VERSION = "24"

[dev]
  port = 4322

[images]
  remote_images = ["https://now.spryker.com/.*"]
